<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check in | Vi Nails</title>
<style>:root{--accent:#b5655d;--ink:#111;--paper:#f6f4ef;--muted:#6b6b6b}*{box-sizing:border-box}body{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px}.logo{font-weight:900;font-size:1.6em;text-transform:uppercase;text-align:center}.demo{background:#fff3cd;border-radius:8px;padding:8px 12px;font-size:.85em;text-align:center;margin-bottom:18px}
h1{font-size:1.5em;margin:18px 0 4px;text-align:center}.sub{color:var(--muted);text-align:center;margin:0 0 20px}label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;padding:14px;font-size:1.05em;border:1px solid #d8d3c8;border-radius:10px;background:#fff}.ok{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.9em;color:#333}.ok input{width:auto;margin-top:3px}
button{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:0;padding:16px;border-radius:999px;font-size:1.1em;font-weight:700}.done{display:none;text-align:center;background:#fff;border-radius:14px;padding:28px 18px;margin-top:10px}.done b{font-size:2.4em;color:var(--accent);display:block}
.foot{text-align:center;font-size:.8em;color:var(--muted);margin-top:28px}</style></head><body><div class="wrap">
<div class="logo">Vi Nails</div><div class="demo">Demo only. Nothing is saved or sent.</div>
<h1>Walk-in check-in</h1><p class="sub">Scan at the front desk. We'll text you when it's your turn.</p>
<form id="f"><label>Your first name</label><input required placeholder="Name">
<label>Mobile number</label><input required type="tel" placeholder="(704) 555-0100">
<label>Service</label><select><option>Manicure</option><option>Pedicure</option><option>Mani + pedi</option><option>Full set / fill</option><option>Lashes or brows</option></select>
<label class="ok"><input type="checkbox" required> Yes, Vi Nails can text me about my turn, a review link, and a reminder to come back. Msg rates may apply. Reply STOP to opt out.</label>
<button>Check in</button></form>
<div class="done" id="d">You're checked in.<b>#4</b>in line. About 25 min.<br><br>We'll text you when it's your turn.</div>
<p class="foot">Free sample made for Vi Nails.</p></div>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();e.target.style.display='none';document.getElementById('d').style.display='block'}</script></body></html>
